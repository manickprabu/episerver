<lib-element-wrapper className="formSelection" [control]="resolvedControl" [submitted]="submitted">
  <lib-element-caption [field]="field" [forId]="field.key" />
  <div class="element-field">
    @if (field.properties.allowMultiSelect) {
      <select
        [id]="field.key"
        class="element-field__control"
        multiple
        [formControl]="$any(resolvedControl)"
        [attr.aria-describedby]="field.key + '_desc'"
        [attr.autocomplete]="field.properties.autoComplete || null"
        [attr.title]="field.properties.description || null"
        (blur)="markTouched()">
        @for (item of field.properties.items || []; track item.value) {
          <option [value]="item.value || ''">{{ item.caption }}</option>
        }
      </select>
    } @else {
      <select
        [id]="field.key"
        class="element-field__control"
        [formControl]="$any(resolvedControl)"
        [attr.aria-describedby]="field.key + '_desc'"
        [attr.autocomplete]="field.properties.autoComplete || null"
        [attr.title]="field.properties.description || null"
        (blur)="markTouched()">
        <option value="" [disabled]="$any(resolvedControl)?.value !== ''">
          {{ placeholderLabel }}
        </option>
        @for (item of field.properties.items || []; track item.value) {
          <option [value]="item.value || ''">{{ item.caption }}</option>
        }
      </select>
    }
    <lib-validation-message [field]="field" [control]="resolvedControl" [submitted]="submitted" />
  </div>
</lib-element-wrapper>
