@if (field.properties.label) {
  @switch (variant) {
    @case ('legend') {
      <legend class="form__Element__Caption form__Element__Caption--legend">{{ field.properties.label }}</legend>
    }
    @case ('div') {
      <div class="form__Element__Caption form__Element__Caption--div">{{ field.properties.label }}</div>
    }
    @default {
      <label [for]="forId || field.key" class="form__Element__Caption form__Element__Caption--label">{{ field.properties.label }}</label>
    }
  }
}
